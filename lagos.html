<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Sapa City: Lagos"><meta property="og:description" content="Go from sapa to soft life in Lagos. Free pixel life sim in your browser.">
<meta name="theme-color" content="#F7C600">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<style>/* Tiny Cities shared styles. City colours come from CSS variables set by each city file. */
:root { --accent:#f7c600; --accentInk:#1d1a14; --ink:#1d1a14; --panel:#fffaf0; --paper:#f6edd8; --good:#2fae5b; --bad:#d9483b; --void:#1c2a36; --muted:#6b5f4b; --stripe: linear-gradient(#f7c600 0 55%, #1d1a14 55% 68%, #f7c600 68% 80%, #1d1a14 80% 92%, #f7c600 92%); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); font-family: Verdana, Geneva, Tahoma, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
canvas#game { position: fixed; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 12px; color: var(--muted); }
.ok { color: var(--good); } .no { color: var(--bad); }

/* pixel panel: hard border + hard shadow */
.panel { background: var(--panel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 2px; }
.stripe { height: 10px; background: var(--stripe); border-bottom: 3px solid var(--ink); }
.stripe.tall { height: 16px; }
.pill { background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn { background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: bold; font-size: 13px; transition: transform .05s; }
.btn:active:not(:disabled), .pill.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--accentInk); }
.btn.big { padding: 12px 22px; font-size: 15px; }
.btn.small { padding: 5px 11px; font-size: 11px; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; flex-shrink: 0; }
.btn.danger { background: var(--bad); color: #fff; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.row.col { flex-direction: column; align-items: stretch; }
.big-e { font-size: 30px; line-height: 1; }
.big-e.huge { font-size: 60px; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.logo { background: var(--accent); color: var(--accentInk); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 5px 12px 5px 8px; border-radius: 999px; display: flex; gap: 6px; align-items: center; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-size: 15px; letter-spacing: -.3px; }
.logo-mark { font-size: 18px; }
.speeds { display: inline-flex; gap: 2px; margin-left: 4px; }
.speeds button { border: 2px solid var(--ink); background: var(--paper); font-size: 9px; padding: 3px 6px; border-radius: 6px; letter-spacing: -2px; font-weight: bold; }
.speeds button.on { background: var(--accent); color: var(--accentInk); }
#clock { font-family: Menlo, Consolas, monospace; font-size: 13px; min-width: 112px; }
#tc { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 46vw; }
#banner { background: var(--good); color: #fff; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 999px; padding: 6px 18px; font-weight: bold; font-size: 13px; white-space: nowrap; max-width: min(380px, calc(100vw - 900px)); min-width: 200px; overflow: hidden; text-overflow: ellipsis; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { background: var(--panel); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: bold; }
#tr { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; }
.money { font-family: Menlo, Consolas, monospace; font-size: 15px; position: relative; background: var(--accent); color: var(--accentInk); }
.money.neg { background: var(--bad); color: #fff; }
.power.off { background: #3b3550; color: #fff; }
.moneyfx { position: absolute; right: 8px; top: 100%; font-size: 13px; font-weight: bold; animation: rise 1.4s ease-out forwards; pointer-events: none; text-shadow: 1px 1px 0 var(--ink); }
.moneyfx.up { color: #7CFC6A; } .moneyfx.down { color: #ff8a7a; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(30px); opacity: 0; } }

#card { position: absolute; left: 12px; bottom: 12px; width: 300px; }
.card-top { display: flex; gap: 10px; padding: 10px 12px 6px; align-items: center; }
#portrait { width: 42px; height: 60px; image-rendering: pixelated; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; }
.nm { font-family: "Arial Black", Arial, sans-serif; font-size: 16px; }
.sub { font-size: 11px; color: var(--muted); margin: 2px 0 5px; }
.moodrow { display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: bold; }
.moodrow .bar { width: 120px; }
.bar { height: 10px; background: #e6dcc6; border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; background: var(--good); transition: width .3s; }
.bar.thin { height: 7px; border-width: 1px; }
.bar.rom i { background: #e84393; }
.tabs { display: flex; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.tabs button { flex: 1; background: var(--paper); border: 0; border-right: 2px solid var(--ink); font-size: 11px; font-weight: bold; padding: 6px 0; }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--accent); color: var(--accentInk); }
#tabBody { padding: 10px 12px; max-height: 210px; overflow: auto; font-size: 11px; }
.needs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.need span { display: block; font-weight: bold; margin-bottom: 2px; }
.moodlets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.ml { border: 1px solid var(--ink); border-radius: 999px; padding: 2px 7px; font-size: 10px; }
.ml.pos { background: #d8f5d0; } .ml.neg { background: #fbd9d3; }
.skills .sk { display: grid; grid-template-columns: 1fr 20px; gap: 2px 6px; margin-bottom: 6px; }
.skills .sk .bar { grid-column: 1 / 3; }
.friends .fr { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; margin-bottom: 7px; }
.friends .fr em { font-size: 10px; color: var(--muted); }
.friends .fr .bar { grid-column: 1 / 3; }
.empty { color: var(--muted); margin: 4px 0; }
.dream { background: var(--paper); border: 2px dashed var(--ink); padding: 7px; border-radius: 4px; margin-bottom: 8px; }
.goal { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted #c9bda4; }
.goal.done span { text-decoration: line-through; color: var(--muted); }

#bc { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
#queue { display: flex; gap: 6px; align-items: center; position: relative; }
.qi { width: 42px; height: 42px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 8px; font-size: 20px; position: relative; overflow: hidden; padding: 0; }
.qi.cur { width: 52px; height: 52px; font-size: 26px; background: var(--paper); }
.qi span { position: relative; z-index: 1; }
.qi i { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--good); }
.qi em { position: absolute; right: 1px; top: -2px; font-style: normal; font-size: 11px; font-weight: bold; opacity: 0; }
.qi:hover em { opacity: 1; }
.qlabel { position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; background: var(--ink); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
#workBtn { background: var(--accent); color: var(--accentInk); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 999px; padding: 12px 22px; font-weight: bold; font-size: 15px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#br { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.round { width: 74px; height: 74px; border-radius: 50%; background: var(--accent); color: var(--accentInk); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-size: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.round span { font-size: 10px; font-weight: bold; margin-top: 3px; }
#venueCard { width: 260px; padding: 10px 12px; font-size: 12px; }
.vc-h { display: flex; gap: 10px; align-items: center; } .vc-h span { font-size: 26px; }
.vc-h b { display: block; font-size: 13px; } .vc-h small { color: var(--muted); }
.vc-d { margin: 8px 0 4px; color: var(--muted); }
.vc-j { display: block; margin: 4px 0; }
.vc-tip { font-size: 11px; background: var(--paper); border-radius: 4px; padding: 5px 7px; margin: 8px 0; }
#venueCard .btn { width: 100%; }
#sticker { position: absolute; right: 100px; bottom: 18px; background: var(--ink); color: var(--accent); font-family: "Arial Black", Arial, sans-serif; font-size: 11px; padding: 5px 10px; transform: rotate(-3deg); border-radius: 3px; letter-spacing: .5px; text-transform: uppercase; pointer-events: none !important; opacity: .9; max-width: 200px; }
body[data-mode="map"] #card, body[data-mode="map"] #sticker, body[data-mode="work"] #venueCard { display: none; }

#bubble { position: fixed; transform: translate(-50%, -100%); background: #fff; border: 3px solid var(--ink); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; pointer-events: none; box-shadow: 2px 2px 0 var(--ink); }
#bubble::after { content: ''; position: absolute; bottom: -9px; left: 12px; width: 8px; height: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 50%; }

#menu { position: fixed; z-index: 30; width: 250px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 6px; overflow: hidden; }
#menu .mh { background: var(--accent); color: var(--accentInk); padding: 7px 10px; font-weight: bold; font-size: 12px; border-bottom: 3px solid var(--ink); }
#menu button { display: grid; grid-template-columns: 26px 1fr; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #e3d8c0; background: none; padding: 7px 10px; font-size: 12px; align-items: center; }
#menu button:hover:not(:disabled) { background: var(--paper); }
#menu button .e { font-size: 17px; grid-row: 1 / 3; }
#menu button .l { font-weight: bold; }
#menu button small { color: var(--muted); font-size: 10px; }
#menu .mf { font-size: 10px; padding: 5px 10px; color: var(--muted); }

#toasts { position: fixed; right: 12px; top: 64px; display: flex; flex-direction: column; gap: 6px; z-index: 40; width: 320px; pointer-events: none; }
.toast { background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 6px; padding: 8px 11px; font-size: 12px; font-weight: bold; animation: slidein .25s ease-out; border-left-width: 10px; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); } .toast.info { border-left-color: var(--accent); }
.toast.out { opacity: 0; transform: translateX(30px); transition: all .35s; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }

#modal { position: fixed; inset: 0; z-index: 50; background: rgba(20,16,10,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.mbox { width: min(480px, 100%); max-height: 88vh; overflow: auto; }
.vi { padding: 16px 18px 18px; }
.vi.center { text-align: center; }
.vi h2 { font-family: "Arial Black", Arial, sans-serif; font-size: 20px; margin: 4px 0 6px; letter-spacing: -.3px; }
.vi h2.q { font-size: 17px; line-height: 1.3; }
.vi h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.vi p { font-size: 13px; line-height: 1.45; }
.vi-t { display: flex; gap: 12px; align-items: center; }
.acts { list-style: none; padding: 0; margin: 0; font-size: 12px; }
.acts li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted #c9bda4; gap: 10px; }
.acts small { color: var(--muted); white-space: nowrap; }
.topts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.topts.col { grid-template-columns: 1fr; }
.topt { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.topt:hover { background: var(--accent); color: var(--accentInk); }
.topt b { font-size: 12px; } .topt small { font-size: 11px; } .topt em { font-size: 10px; font-style: normal; color: var(--muted); }
.bigmoney { font-family: Menlo, Consolas, monospace; font-size: 30px; font-weight: bold; margin: 8px 0; color: var(--good); }
.perks { text-align: left; font-size: 13px; line-height: 1.6; padding-left: 20px; }

/* work panel */
#workPanel { position: fixed; right: 12px; bottom: 12px; width: 290px; z-index: 20; }
.wp { padding: 12px; font-size: 12px; }
.wp-h { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; } .wp-h b { display: block; font-size: 14px; } .wp-h small { color: var(--muted); }
.wp label { display: block; font-weight: bold; font-size: 11px; margin: 8px 0 3px; }
.styles { display: flex; gap: 4px; } .styles button { flex: 1; font-size: 10px; padding: 6px 2px; border: 2px solid var(--ink); background: var(--paper); border-radius: 6px; font-weight: bold; }
.styles button.on { background: var(--accent); color: var(--accentInk); }
.hint { display: block; color: var(--muted); margin: 8px 0; line-height: 1.4; }
.wp .btn { width: 100%; }
body[data-mode="work"] #br { display: none; }

/* phone */
.phonewrap .mbox { width: 360px; background: #15121c; border-radius: 30px; padding: 10px; border: 3px solid var(--ink); }
.phone { background: var(--panel); border-radius: 22px; overflow: hidden; min-height: 560px; display: flex; flex-direction: column; }
.ph-top { display: flex; justify-content: space-between; font-size: 10px; padding: 8px 16px 2px; font-weight: bold; }
.ph-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 3px solid var(--ink); background: var(--accent); color: var(--accentInk); }
.ph-h b { flex: 1; font-size: 15px; font-family: "Arial Black", Arial, sans-serif; }
.ph-h button { border: 2px solid var(--ink); background: var(--panel); border-radius: 50%; width: 28px; height: 28px; font-weight: bold; font-size: 16px; line-height: 1; padding: 0; }
.ph-body { padding: 12px; overflow: auto; max-height: 64vh; font-size: 12px; flex: 1; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; padding: 10px 4px; }
.app { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.app span { width: 58px; height: 58px; border-radius: 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.app:hover span { background: var(--accent); }
.app em { font-style: normal; font-size: 11px; font-weight: bold; }
.phone-foot { text-align: center; font-family: "Arial Black", Arial, sans-serif; font-size: 11px; background: var(--ink); color: var(--accent); margin: 16px 10px 4px; padding: 6px; border-radius: 4px; text-transform: uppercase; transform: rotate(-1.5deg); }
.pcard { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 10px; margin-bottom: 10px; line-height: 1.5; }
.pcard.center { text-align: center; }
.pcard .btn { margin-top: 6px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px dotted #c9bda4; line-height: 1.4; }
.li small { color: var(--muted); font-size: 10.5px; }
.li em { font-style: normal; font-size: 10px; font-weight: bold; color: var(--good); flex-shrink: 0; }
.li.mine { background: #fff3c4; }
.ph-body h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 14px 0 4px; }

/* map */
#pins { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#pins > * { position: absolute; left: 0; top: 0; pointer-events: auto; }
.pin { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px 2px 3px; display: flex; align-items: center; gap: 4px; margin: -38px 0 0 -16px; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.pin span { width: 24px; height: 24px; background: var(--paper); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.pin em { font-style: normal; font-size: 10px; font-weight: bold; }
.pin::after { content: ''; position: absolute; left: 12px; bottom: -8px; border: 6px solid transparent; border-top-color: var(--ink); }
.pin:hover { background: var(--accent); z-index: 3; }
.pin.closed { opacity: .6; } .pin.closed em::after { content: ' · closed'; color: var(--bad); }
.pin.home { background: var(--accent); }
.district { font-family: "Arial Black", Arial, sans-serif; font-size: 12px; color: rgba(255,255,255,.92); text-shadow: 2px 2px 0 rgba(0,0,0,.5); letter-spacing: 2px; text-transform: uppercase; pointer-events: none !important; transform-origin: 0 0; margin: -8px 0 0 -30px; }
.locked { background: var(--accent); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 9px; font-size: 10px; font-weight: bold; margin: -10px 0 0 -40px; white-space: nowrap; background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,.08) 6px 12px); }

/* overlays: title, creator, travel */
#overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; background: rgba(20,16,10,.35); }
#overlay.titlescreen { background: radial-gradient(circle at 50% 40%, rgba(0,0,0,0), rgba(0,0,0,.45)), var(--void); }
.title-card { width: min(460px, 100%); text-align: center; }
.tc-in { padding: 22px 26px 24px; }
.tc-logo { font-size: 44px; }
.title-card h1 { font-family: "Arial Black", Arial, sans-serif; font-size: 44px; margin: 4px 0; letter-spacing: -1.5px; line-height: 1; }
.tag { font-size: 14px; color: var(--muted); margin: 6px 0 14px; }
#titleTinies { width: 360px; max-width: 100%; height: 90px; image-rendering: pixelated; margin: 4px auto 6px; display: block; }
.slogan { display: inline-block; margin-top: 12px; background: var(--ink); color: var(--accent); font-family: "Arial Black", Arial, sans-serif; font-size: 12px; padding: 6px 12px; transform: rotate(-2deg); text-transform: uppercase; }
.creator { width: min(760px, 100%); max-height: 94vh; overflow: auto; }
.cr-in { padding: 16px 20px 20px; }
.cr-in.center { text-align: center; }
.cr-in h2 { font-family: "Arial Black", Arial, sans-serif; margin: 2px 0 10px; font-size: 22px; }
.cr-in label { display: block; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; color: var(--muted); }
.cr-grid { display: grid; grid-template-columns: 160px 1fr; gap: 18px; }
.cr-prev { background: var(--paper); border: 3px solid var(--ink); border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; }
#crPrev { width: 120px; height: 144px; image-rendering: pixelated; }
#crName { width: 100%; border: 2px solid var(--ink); border-radius: 6px; padding: 6px; font-family: inherit; font-weight: bold; text-align: center; font-size: 14px; }
.cr-opts label { margin-top: 6px; }
.sw { display: flex; flex-wrap: wrap; gap: 5px; }
.swc { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; padding: 0; }
.swc.on, .swt.on { outline: 3px solid var(--accent); outline-offset: 1px; box-shadow: 0 0 0 1px var(--ink); }
.swt { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; font-size: 11px; padding: 3px 9px; font-weight: bold; }
.traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.trait { text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; }
.trait b { font-size: 12px; } .trait small { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.trait.on { background: var(--accent); color: var(--accentInk); box-shadow: 3px 3px 0 var(--ink); }

// ===== Tiny Cities: pixel isometric renderer =====
'use strict';
const R = {};
R.cv = null; R.ctx = null; R.S = 3; R.W = 0; R.H = 0;

R.init = function (canvas) {
  R.cv = canvas; R.ctx = canvas.getContext('2d');
  R.resize();
  window.addEventListener('resize', () => R.resize());
};
R.setScale = function (s) { R.S = s; R.resize(); };
R.resize = function () {
  const s = window.innerWidth < 700 ? Math.max(2, R.S - 1) : R.S;
  R.eff = s;
  R.W = Math.ceil(window.innerWidth / s); R.H = Math.ceil(window.innerHeight / s);
  R.cv.width = R.W; R.cv.height = R.H;
  R.cv.style.width = (R.W * s) + 'px'; R.cv.style.height = (R.H * s) + 'px';
  R.ctx.imageSmoothingEnabled = false;
  if (R.onResize) R.onResize();
};

// ---- color helpers ----
R.shade = function (hex, amt) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  r = Math.max(0, Math.min(255, Math.round(r + amt))); g = Math.max(0, Math.min(255, Math.round(g + amt))); b = Math.max(0, Math.min(255, Math.round(b + amt)));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
};

// crisp convex polygon fill (scanline)
R.poly = function (ctx, pts, color) {
  ctx.fillStyle = color;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  minY = Math.round(minY); maxY = Math.round(maxY);
  const n = pts.length;
  for (let y = minY; y < maxY; y++) {
    const yc = y + 0.5; let x0 = Infinity, x1 = -Infinity;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) {
        const x = a[0] + (yc - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
        x0 = Math.min(x0, x); x1 = Math.max(x1, x);
      }
    }
    if (x1 > x0) ctx.fillRect(Math.round(x0), y, Math.round(x1) - Math.round(x0), 1);
  }
};

// iso projection with half tile sizes tw,th
R.iso = function (gx, gy, tw, th) { return [(gx - gy) * tw, (gx + gy) * th]; };

// draw iso box. (ox,oy)=screen origin of grid (0,0) top corner. footprint at gx,gy size w,d, height h px, z lift px
R.box = function (ctx, ox, oy, gx, gy, w, d, h, col, tw, th, z) {
  tw = tw || 16; th = th || 8; z = z || 0;
  const P = (a, b) => { const p = R.iso(a, b, tw, th); return [ox + p[0], oy + p[1] - z]; };
  const T = P(gx, gy), Rr = P(gx + w, gy), B = P(gx + w, gy + d), L = P(gx, gy + d);
  const up = (p) => [p[0], p[1] - h];
  const top = typeof col === 'string' ? col : col.top;
  const left = typeof col === 'string' ? R.shade(col, -28) : (col.left || R.shade(col.top, -28));
  const right = typeof col === 'string' ? R.shade(col, -50) : (col.right || R.shade(col.top, -50));
  if (h > 0) {
    R.poly(ctx, [L, B, up(B), up(L)], left);
    R.poly(ctx, [B, Rr, up(Rr), up(B)], right);
  }
  R.poly(ctx, [up(T), up(Rr), up(B), up(L)], top);
  return { x0: L[0], x1: Rr[0], y0: T[1] - h, y1: B[1] };
};

R.tile = function (ctx, ox, oy, gx, gy, color, tw, th) {
  tw = tw || 16; th = th || 8;
  const p = R.iso(gx, gy, tw, th); const x = ox + p[0], y = oy + p[1];
  R.poly(ctx, [[x, y], [x + tw, y + th], [x, y + 2 * th], [x - tw, y + th]], color);
};

// ---- seeded random ----
R.rng = function (seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; };

R.drawTiny = function (ctx, x, y, look, dir, frame, opts) {
  // x,y = feet center position
  opts = opts || {};
  const back = dir === 'up' || dir === 'upl';
  const flip = dir === 'left' || dir === 'upl';
  const rows = (back ? SPR_BODY_BACK : SPR_BODY_FRONT).slice();
  if (frame) { const w = SPR_WALK[frame % 2]; rows[13] = w[0]; rows[14] = w[1]; rows[15] = w[2]; }
  const hair = (HAIR[look.hair] || HAIR.short)[back ? 'b' : 'f'];
  const colors = { s: look.skin, e: '#1a1410', S: look.shirt, p: look.pants || '#2d3a5a', k: '#1d1d1d', h: look.hairColor || '#1b1410' };

  for (let r = 0; r < 16; r++) {
    for (let c = 0; c < 10; c++) {
      const cc = flip ? 9 - c : c;
      let code = rows[r][cc];
      const hr = hair[r]; if (hr && hr[cc] === 'h') code = 'h';
      if (code === '.') continue;
      let col = colors[code];
      if (code === 'S' && (c === 1 || c === 8)) col = R.shade(look.shirt, -25);

};

// little pixel emoji-free icons drawn on canvas for plumbob etc
R.plumbob = function (ctx, x, y, color, t) {
  const b = Math.round(Math.sin(t / 300) * 1.5);
  const pts = [[x, y - 6 + b], [x + 3, y - 2 + b], [x, y + 2 + b], [x - 3, y - 2 + b]];

// ===== Tiny Cities: simulation core =====
'use strict';
let G = null;           // saved state
const Q = [];           // action queue (not saved)
const CT = () => window.CITY;
const TX = (k, d) => (CT().text && CT().text[k] !== undefined) ? CT().text[k] : d;
const NEEDS = ['hunger', 'energy', 'fun', 'social', 'hygiene', 'bladder'];
const NEED_LABEL = { hunger: 'Hunger', energy: 'Energy', fun: 'Fun', social: 'Social', hygiene: 'Hygiene', bladder: 'Bladder' };
const SKILLS = ['cooking', 'charisma', 'fitness', 'coding', 'music', 'hustle', 'comedy'];
const SKILL_LABEL = { cooking: 'Cooking', charisma: 'Charisma', fitness: 'Fitness', coding: 'Coding', music: 'Music', hustle: 'Hustle', comedy: 'Comedy' };
const SKILL_EMOJI = { cooking: '🍳', charisma: '💬', fitness: '💪', coding: '💻', music: '🎵', hustle: '💼', comedy: '😂' };
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SPEEDS = [0, 2, 6, 15]; // game minutes per real second
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const money = (n) => CT().cur + Math.round(n).toLocaleString('en-US');

const Game = {};
Game.day = () => Math.floor(G.t / 1440);
Game.dow = () => Game.day() % 7;
Game.hour = () => Math.floor((G.t % 1440) / 60);
Game.minute = () => Math.floor(G.t % 60);
Game.hm = () => (G.t % 1440) / 60;
Game.clock = () => { const h = Game.hour(), m = Game.minute(); const ap = h < 12 ? 'AM' : 'PM'; const hh = h % 12 || 12; return `${DAYS[Game.dow()]} ${hh}:${String(m).padStart(2, '0')} ${ap}`; };
Game.weekNo = () => Math.floor(Game.day() / 7) + 1;
Game.key = () => 'tinycity_' + CT().id;

Game.newState = function (opts) {
  const C = CT();
  const skills = {}; const xp = {};
  SKILLS.forEach(s => { skills[s] = 0; xp[s] = 0; });
  G = {
    v: 1, city: C.id, t: 7 * 60, speed: 1,
    tiny: {
      name: opts.name, look: opts.look, traits: opts.traits, dream: opts.dream,
      skills, xp, needs: { hunger: 70, energy: 85, fun: 65, social: 60, hygiene: 70, bladder: 80 },
      moodlets: [], money: 0, job: null, lottery: null, home: null, items: [], loan: null, rentDebt: 0,
      car: null, partner: null, goals: {}, stats: { shifts: 0, friends: 0, cooked: 0, gigs: 0, earned: 0 }, gigRest: {}, pitchDay: -1, learn: 1, lastShiftDay: -1, missedChecked: -1,
    },
    rel: {}, biz: [], land: [], power: true, powerEnds: 0, genFuel: 0, cuts: [],
    weekly: null, daily: [], election: null, policy: null, governor: null, playerGov: false,
    loc: 'home', log: [], dreamDone: false, autonomy: true, lastVenue: null,
  };
  C.npcs.forEach(n => { G.rel[n.name] = { f: 0, r: 0, status: 'stranger', met: false }; });
  Game.rollWeek(true);
  Game.rollDay();
};

Game.applyLottery = function (kind, homeId) {
  const C = CT(); const T = G.tiny; const L = C.lottery[kind];
  T.lottery = kind;
  if (kind === 'rich') {
    T.money = L.cash; T.home = L.home; T.rentPaidBy = L.rentPayer || 'Daddy';
    if (L.job) T.job = { career: L.job[0], level: L.job[1], perf: 50, since: 0 };
    Object.assign(T.skills, L.skills || {});
    (L.items || []).forEach(i => T.items.push(i));
    if (L.car) T.car = L.car;
  } else {
    T.home = homeId; T.money = (L.cash && L.cash[homeId]) || 50000;
    if (L.loan) T.loan = { weekly: L.loan.weekly, left: L.loan.weeks, name: L.loan.name };
    Object.assign(T.skills, L.skills || {});
    T.learn = L.learnBoost || 1;
  }
  SKILLS.forEach(s => { T.xp[s] = Game.xpFor(T.skills[s]); });
};

// ---- traits ----
Game.trait = (id) => CT().traits.find(t => t.id === id);
Game.mod = function (kind, key) {
  let m = 1;
  G.tiny.traits.forEach(id => { const t = Game.trait(id); if (!t || !t.mods) return; const g = t.mods[kind]; if (g && g[key] !== undefined) m *= g[key]; });
  return m;
};
Game.workMod = function () { let m = 0; G.tiny.traits.forEach(id => { const t = Game.trait(id); if (t && t.mods && t.mods.work) m += t.mods.work; }); return m; };

// ---- skills ----
Game.xpFor = (lvl) => { let s = 0; for (let i = 0; i < lvl; i++) s += 100 + i * 60; return s; };
Game.addXp = function (skill, amount) {
  const T = G.tiny; if (!skill) return;
  const moodMul = 0.6 + Game.mood() / 125;
  T.xp[skill] += amount * T.learn * Game.mod('skill', skill) * moodMul;
  while (T.skills[skill] < 10 && T.xp[skill] >= Game.xpFor(T.skills[skill] + 1)) {
    T.skills[skill]++;
    UI.toast(`${SKILL_EMOJI[skill]} ${SKILL_LABEL[skill]} is now level ${T.skills[skill]}!`, 'good');
    Game.checkGoals();
  }
};

// ---- moodlets & mood ----
Game.addMoodlet = function (id, text, val, hours) {
  const T = G.tiny; T.moodlets = T.moodlets.filter(m => m.id !== id);
  T.moodlets.push({ id, text, val, until: G.t + hours * 60 });
};
Game.autoMoodlets = function () {
  const n = G.tiny.needs, out = [];
  if (n.hunger < 15) out.push({ text: 'Hungry die 😫', val: -20 });
  if (n.energy < 15) out.push({ text: 'Exhausted 😴', val: -20 });
  if (n.bladder < 15) out.push({ text: 'Must pee NOW', val: -20 });
  if (n.hygiene < 15) out.push({ text: 'Smelling 🤢', val: -15 });
  if (n.fun < 15) out.push({ text: 'Bored stiff', val: -12 });
  if (n.social < 15) out.push({ text: 'Lonely', val: -12 });
  if (G.tiny.rentDebt > 0) out.push({ text: 'Owing rent 😬', val: -10 });
  if (!Game.hasPower() && G.loc === 'home') out.push({ text: TX('noPowerMood', 'No light, no fan 🥵'), val: -8 });
  return out;
};
Game.mood = function () {
  const n = G.tiny.needs; let avg = 0; NEEDS.forEach(k => avg += n[k]); avg /= NEEDS.length;
  let m = avg;
  G.tiny.moodlets.forEach(x => m += x.val * 0.5); Game.autoMoodlets().forEach(x => m += x.val * 0.5);
  return clamp(m, 0, 100);
};
Game.moodLabel = function () { const m = Game.mood(); return m > 75 ? 'Happy' : m > 55 ? 'Fine' : m > 35 ? 'Uncomfortable' : 'Miserable'; };
Game.moodColor = function () { const m = Game.mood(); return m > 75 ? '#3fd16a' : m > 55 ? '#a5d63f' : m > 35 ? '#f0b429' : '#e5483b'; };

// ---- power ----
Game.hasSolar = () => G.tiny.items.includes('solar');
Game.hasGen = () => G.tiny.items.includes('generator');
Game.gridOn = () => G.power;
Game.hasPower = function () { return G.power || Game.hasSolar() || (Game.hasGen() && G.genFuel > G.t); };
Game.genRunning = () => !G.power && !Game.hasSolar() && Game.hasGen() && G.genFuel > G.t;

// ---- money ----
Game.pay = function (amt, why) { G.tiny.money += amt; if (amt > 0) G.tiny.stats.earned += amt; if (why) UI.moneyFx(amt); };
Game.spend = function (amt) { if (G.tiny.money < amt) { UI.toast(`Not enough money. You need ${money(amt)}.`, 'bad'); return false; } G.tiny.money -= amt; UI.moneyFx(-amt); return true; };
Game.priceMul = function (kind) {
  let m = 1;
  if (kind === 'food' && G.policy === 'food') m *= 0.7;
  if (kind === 'transport') { if (G.daily.includes('fuel')) m *= 1.5; if (G.policy === 'transport') m *= 0.5; }
  return m;
};
Game.netWorth = function () {
  let w = G.tiny.money;
  G.biz.forEach(b => { const d = CT().businesses.find(x => x.id === b.id); if (d) w += d.cost * 0.7; });
  G.land.forEach(l => w += l.value);
  if (G.tiny.loan) w -= G.tiny.loan.weekly * G.tiny.loan.left;
  return w;
};

// ---- careers ----
Game.career = (id) => CT().careers.find(c => c.id === id);
Game.jobTitle = function () { const j = G.tiny.job; if (!j) return 'Unemployed'; const c = Game.career(j.career); return c.levels[j.level - 1][0]; };
Game.shiftPay = function () {
  const j = G.tiny.job; if (!j) return 0; const c = Game.career(j.career);
  let p = c.levels[j.level - 1][1]; if (G.policy === 'wage') p *= 1.15; return p;
};
Game.promoReq = function (c, lvl) { // skill level needed to reach lvl
  const mid = c.req > 0; const table = mid ? [c.req, c.req + 1, c.req + 2, c.req + 4, c.req + 6] : [0, 1, 3, 5, 7];
  return table[lvl - 1];
};
Game.isWorkDay = function (dow) { const j = G.tiny.job; if (!j) return false; const c = Game.career(j.career); return c.days.includes(dow === undefined ? Game.dow() : dow); };
Game.shiftWindow = function () {
  // returns {canGo, late, msg}
  const j = G.tiny.job; if (!j) return { canGo: false };
  if (j.since > Game.day()) return { canGo: false, msg: 'Job starts tomorrow' };
  const c = Game.career(j.career); const h = Game.hm();
  if (!Game.isWorkDay()) return { canGo: false };
  if (G.tiny.lastShiftDay === Game.day()) return { canGo: false, msg: 'Shift done today' };
  if (h >= c.start - 1.5 && h < c.start + c.len - 1) return { canGo: true, late: h > c.start + 0.25 };
  return { canGo: false };
};

// ---- events ----
Game.rollWeek = function (first) {
  const C = CT();
  const ev = pick(C.events.weekly); G.weekly = ev.id;
  // election cycle
  if (!first && G.election) {
    // applied in electionResult on Sunday
  }
  const cands = [];
  const pool = C.npcs.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  const pols = C.election.policies.slice().sort(() => Math.random() - 0.5);
  pool.forEach((n, i) => cands.push({ name: n.name, policy: pols[i % pols.length].id, votes: Math.floor(rnd(800, 4000)) }));
  G.election = { cands, voted: null, running: false, week: Game.weekNo() };
};
Game.rollDay = function () {
  const C = CT(); G.daily = [];
  (C.events.daily || []).forEach(e => { let ch = e.chance; if (e.id === 'powercut' && G.policy === 'power') ch *= 0.25; if (Math.random() < ch) G.daily.push(e.id); });
  // power cuts schedule
  G.cuts = [];
  if (G.daily.includes('powercut')) {
    const n = Math.random() < 0.5 ? 1 : 2;
    for (let i = 0; i < n; i++) { const s = Game.day() * 1440 + Math.floor(rnd(7, 21)) * 60; G.cuts.push([s, s + Math.floor(rnd(2, 6)) * 60]); }
  }
  G.daily.forEach(id => { const e = C.events.daily.find(x => x.id === id); if (e && id !== 'powercut') UI.toast(e.emoji + ' ' + e.text, 'info', 6000); });
};
Game.electionResult = function () {
  const E = G.election; if (!E) return;
  let best = null;
  E.cands.forEach(c => { c.votes += Math.floor(rnd(0, 3000)); if (!best || c.votes > best.votes) best = c; });
  if (E.running) {
    const T = G.tiny; const friends = Object.values(G.rel).filter(r => r.f >= 30).length;
    const myVotes = Math.floor(1500 + T.skills.charisma * 700 + friends * 400 + rnd(0, 2500));
    const me = { name: T.name + ' (you)', policy: E.running, votes: myVotes, me: true }; E.cands.push(me);
    if (myVotes > best.votes) best = me;
  }
  const pol = CT().election.policies.find(p => p.id === best.policy);
  G.policy = best.policy; G.governor = best.name; G.playerGov = !!best.me;
  UI.toast(`🗳️ ${best.name} wins ${CT().election.title}! New policy: ${pol.name}`, best.me ? 'good' : 'info', 8000);
  if (best.me) { Game.addMoodlet('gov', `Elected ${CT().election.title}! 👑`, 30, 48); }
};

// ---- weekly money ----
Game.saturdayBills = function () {
  const T = G.tiny; const C = CT(); const home = C.homes[T.home];
  if (T.lottery === 'rich' && T.home === C.lottery.rich.home) {
    UI.toast(`🏠 ${T.rentPaidBy} paid your rent this week. ${C.lottery.rich.tag}`, 'info');
  } else {
    const due = home.rent + T.rentDebt;
    if (T.money >= due) { T.money -= due; T.rentDebt = 0; UI.toast(`🏠 ${TX('rentPaid', 'Rent paid')}: ${money(due)}`, 'info'); UI.moneyFx(-due); }
    else {
      T.rentDebt = due - Math.max(0, T.money); UI.moneyFx(-Math.max(0, T.money)); T.money = Math.max(0, T.money) > 0 ? 0 : T.money;
      UI.toast(`🏠 ${TX('rentShort', 'You could not pay rent!')} You owe ${money(T.rentDebt)}.`, 'bad', 7000);
      if (T.rentDebt > home.rent * 2 && T.home !== C.cheapHome) {
        T.home = C.cheapHome; T.rentDebt = 0; Game.addMoodlet('evicted', 'Evicted! 😭', -30, 48);
        UI.toast(`📜 ${TX('evicted', 'Quit notice! You have been evicted.')}`, 'bad', 9000);
        if (G.loc === 'home') Scene.loadHome();
      }
    }
  }
  if (T.loan && T.loan.left > 0) {
    T.money -= T.loan.weekly; T.loan.left--; UI.moneyFx(-T.loan.weekly);
    UI.toast(`🏦 ${T.loan.name} repayment: ${money(T.loan.weekly)} (${T.loan.left} left)`, 'info');
    if (T.loan.left === 0) { UI.toast(`🎉 ${T.loan.name} fully paid off!`, 'good'); Game.addMoodlet('debtfree', 'Debt free! 🎉', 20, 48); }
  }
};
Game.businessPayout = function () {
  const C = CT(); let total = 0;
  G.biz.forEach(b => {
    const d = C.businesses.find(x => x.id === b.id); if (!d) return;
    if (Math.random() < (d.bad || 0.08)) { total -= d.badCost; UI.toast(`📉 ${d.name}: ${d.badText} (-${money(d.badCost)})`, 'bad', 6000); }
    else total += Math.round(rnd(d.min, d.max) / 100) * 100;
  });
  if (G.playerGov) total += C.election.allowance;
  if (total !== 0) { Game.pay(total, true); if (total > 0) UI.toast(`💰 Evening income: ${money(total)}`, 'good'); }
};
Game.landGrowth = function () {
  const C = CT();
  G.land.forEach(l => { const d = C.land.find(x => x.id === l.id); l.value = Math.round(l.value * (1 + d.growth)); });
};

// ---- minute tick ----
Game.tickMinute = function () {
  const T = G.tiny; const prevH = Game.hour(); const prevDay = Game.day();
  G.t += 1;
  const h = Game.hour(), m = Game.minute(), dow = Game.dow();
  // power
  let out = false; G.cuts.forEach(c => { if (G.t >= c[0] && G.t < c[1]) out = true; });
  if (G.power && out) { G.power = false; UI.toast(`⚡ ${TX('powerCut', 'Power cut!')}` + (Game.hasSolar() ? ' Solar dey carry everything 😎' : Game.hasGen() && G.genFuel > G.t ? ` ${TX('genName', 'Generator')} kicks in.` : ''), 'bad'); Scene.onPowerChange(); }
  if (!G.power && !out) { G.power = true; UI.toast(`💡 ${TX('powerBack', 'Power is back!')}`, 'good'); Scene.onPowerChange(); }
  if (Game.genRunning()) { /* fuel counts down by time */ }
  // needs
  const asleep = Game.current() && Game.current().sleep;
  const atWork = G.loc === 'work';
  const rate = { hunger: 5, energy: 3.8, fun: 4, social: 3, hygiene: 3.2, bladder: 8 };
  if (asleep) { rate.hunger = 2.2; rate.energy = 0; rate.fun = 0; rate.social = 0.4; rate.hygiene = 1.2; rate.bladder = 3; }
  if (atWork) { const st = Work.style; rate.energy = [3, 5.5, 8][st]; rate.fun = [1.5, 4, 7][st]; rate.social = 0.5; rate.bladder = 0; rate.hunger = 4.5; }
  if (G.loc === 'travel') { rate.bladder = 4; }
  if (G.weekly === 'owambe') rate.fun *= 1.2;
  NEEDS.forEach(k => { const d = rate[k] * Game.mod('drain', k) / 60; T.needs[k] = clamp(T.needs[k] - d, 0, 100); });
  // active action effects
  Game.actionTick();
  // collapse checks
  if (G.loc === 'home' || G.loc === 'venue') Game.collapseCheck();
  // expire moodlets
  T.moodlets = T.moodlets.filter(x => x.until > G.t);
  // schedule
  if (Game.day() !== prevDay) { if (dow === 0) { Game.landGrowth(); Game.rollWeek(); UI.toast(`📅 Week ${Game.weekNo()} begins. ${Game.weeklyEvent().emoji} ${Game.weeklyEvent().text}`, 'info', 7000); } }
  if (h !== prevH) {
    if (h === 6) Game.rollDay();
    if (h === 9 && dow === (CT().rentDay ?? 5)) Game.saturdayBills();
    if (h === 18) Game.businessPayout();
    if (h === 20 && dow === 6) Game.electionResult();
    // shift reminder
    const j = T.job;
    if (j && Game.isWorkDay() && j.since <= Game.day() && T.lastShiftDay !== Game.day()) {
      const c = Game.career(j.career);
      if (h === Math.floor(c.start) - 1) UI.toast(`⏰ Your ${Game.jobTitle()} shift at ${c.place} starts at ${fmtH(c.start)}. Tap "Go to work".`, 'info', 7000);
      if (h === Math.floor(c.start + c.len - 1) && T.missedChecked !== Game.day() && Scene.mode !== 'work') {
        T.missedChecked = Game.day(); j.perf = clamp(j.perf - 15, 0, 100); Game.addMoodlet('missed', 'Missed work 😬', -10, 12);
        UI.toast(`😠 You missed your shift. ${TX('bossName', 'Oga')} is not happy (performance -15%).`, 'bad', 7000);
      }
    }
    if (h % 1 === 0) Game.save();
  }
  if (T.money >= 0) Game.checkGoals(true);
};
const fmtH = (h) => { const hh = Math.floor(h) % 24; return `${hh % 12 || 12}${h % 1 ? ':30' : ''} ${hh < 12 ? 'AM' : 'PM'}`; };
Game.weeklyEvent = () => CT().events.weekly.find(e => e.id === G.weekly) || CT().events.weekly[0];

Game.collapseCheck = function () {
  const T = G.tiny, n = T.needs;
  if (n.bladder <= 0) { n.bladder = 100; n.hygiene = 0; Game.addMoodlet('accident', 'Embarrassed 😳', -25, 6); UI.toast('😳 Oops... couldn\'t hold it. Very embarrassing.', 'bad'); }
  if (n.energy <= 0 && !(Game.current() && Game.current().sleep)) { Q.length = 0; n.energy = 35; G.t += 180; Game.addMoodlet('passout', 'Slept on the floor', -15, 8); UI.toast('😵 Your Tiny passed out from exhaustion!', 'bad'); }
  if (n.hunger <= 0) { Q.length = 0; n.hunger = 50; const bill = CT().hospitalBill; T.money -= bill; UI.moneyFx(-bill); Game.addMoodlet('faint', 'Fainted from hunger', -20, 12); UI.toast(`🚑 Fainted from hunger. Hospital bill: ${money(bill)}`, 'bad', 7000); }
};

// ---- action queue ----
Game.current = () => Q[0] && Q[0].started ? Q[0] : null;
Game.enqueue = function (a) { if (Q.length >= 6) { UI.toast('Queue is full', 'bad'); return; } Q.push(a); UI.renderQueue(); };
Game.cancel = function (i) { if (i === 0 && Q[0] && Q[0].started && Q[0].onCancel) Q[0].onCancel(); Q.splice(i, 1); UI.renderQueue(); };
Game.startAction = function (a) {
  if (a.check && !a.check()) { Q.shift(); UI.renderQueue(); return; }
  if (a.cost && !Game.spend(a.cost)) { Q.shift(); UI.renderQueue(); return; }
  a.started = true; a.left = a.dur; a.elapsed = 0;
  if (a.onStart) a.onStart();
  UI.renderQueue();
};
Game.actionTick = function () {
  const a = Game.current(); if (!a) return;
  const T = G.tiny;
  if (a.needs) { for (const k in a.needs) { const per = a.needs[k] / a.dur; T.needs[k] = clamp(T.needs[k] + per * (k === 'energy' || k === 'fun' || k === 'social' ? 1 : 1), 0, 100); } }
  if (a.rate) { for (const k in a.rate) T.needs[k] = clamp(T.needs[k] + a.rate[k] / 60, 0, 100); }
  if (a.skill) Game.addXp(a.skill, (a.xp || 40) / 60);
  a.left--; a.elapsed++;
  if (a.needsPower && !Game.hasPower()) { UI.toast(`⚡ ${TX('powerCut', 'Power cut!')} Can't continue.`, 'bad'); Game.finish(a, true); return; }
  if (a.left <= 0 || (a.until && a.until())) Game.finish(a, false);
};
Game.finish = function (a, aborted) {
  if (!aborted && a.onEnd) a.onEnd();
  if (aborted && a.onCancel) a.onCancel();
  if (Q[0] === a) Q.shift();
  UI.renderQueue(); Game.checkGoals();
};

// ---- autonomy (free will) ----
Game.wakeForWork = function () {
  const T = G.tiny, j = T.job; if (!j || !Game.isWorkDay() || j.since > Game.day() || T.lastShiftDay === Game.day()) return false;
  const c = Game.career(j.career); const now = Game.hour() + Game.minute() / 60;
  if (now >= c.start - 1 && now < c.start && T.needs.energy > 45) { if (!Game._woke || Game._woke !== Game.day()) { Game._woke = Game.day(); UI.toast(`⏰ Alarm! Time to get ready for work.`, 'info'); } return true; }
  return false;
};
Game.autonomy = function () {
  if (!G.autonomy || Q.length || G.loc !== 'home' || Scene.mode !== 'home') return;
  const n = G.tiny.needs; const order = NEEDS.slice().sort((a, b) => n[a] - n[b]);
  const map = { hunger: ['stove', 'cylinder', 'fridge', 'cooler'], energy: ['bed', 'mat'], bladder: ['toilet'], hygiene: ['shower', 'bucket'], fun: ['tv', 'keyboard', 'sofa', 'desk'], social: ['sofa', 'desk'] };
  for (const k of order) {
    if (n[k] > (k === 'energy' ? 25 : 35)) break;
    for (const obj of Scene.objs.filter(o => map[k].includes(o.type))) {
      const acts = HomeActs.list(obj).filter(x => !x.disabled && x.make); if (!acts.length) continue;
      const act = acts[0]; const a = act.make(); a.free = true; a.label = a.label || act.label; Game.enqueue(a); return;
    }
    if (k === 'fun') { Game.enqueue(Object.assign(mk({ label: 'Dance to music on phone', emoji: '💃', dur: 30, rate: { fun: 30, energy: -4 } }), { free: true })); return; }
    if (k === 'social') { Game.enqueue(Object.assign(mk({ label: 'Chat with friends on phone', emoji: '💬', dur: 30, rate: { social: 35 } }), { free: true })); return; }
  }
};

// ---- goals ----
Game.flag = function (f) { G.tiny.goals['f_' + f] = true; Game.checkGoals(); };
Game.checkGoals = function (quiet) {
  const T = G.tiny; const C = CT();
  C.goals.forEach(g => {
    if (T.goals[g.id]) return;
    let ok = false; const c = g.check;
    if (c.startsWith('flag:')) ok = !!T.goals['f_' + c.slice(5)];
    else if (c === 'job') ok = !!T.job;
    else if (c === 'friend') ok = Object.values(G.rel).some(r => r.f >= 30);
    else if (c === 'skill2') ok = SKILLS.some(s => T.skills[s] >= 2 && !(C.lottery.poor.skills && C.lottery.poor.skills[s] >= 2 && T.lottery === 'poor') && !(C.lottery.rich.skills && C.lottery.rich.skills[s] >= 2 && T.lottery === 'rich'));
    else if (c === 'shift') ok = T.stats.shifts > 0;
    if (ok) { T.goals[g.id] = true; Game.pay(g.reward, true); UI.toast(`✅ Goal complete: ${g.text} (+${money(g.reward)})`, 'good'); UI.renderGoals && UI.renderGoals(); }
  });
  // dream
  if (!G.dreamDone && T.dream) {
    const d = C.dreams.find(x => x.id === T.dream); let ok = false;
    if (d.check === 'top') ok = T.job && T.job.level >= 5;
    if (d.check === 'land3') ok = G.land.length >= 3;
    if (d.check === 'networth') ok = Game.netWorth() >= d.amount;
    if (d.check === 'friends8') ok = Object.values(G.rel).filter(r => r.f >= 30).length >= 8;
    if (d.check === 'married') ok = !!T.partner && G.rel[T.partner] && G.rel[T.partner].status === 'married';
    if (d.check === 'biz3') ok = G.biz.length >= 3;
    if (d.check === 'skill10') ok = SKILLS.some(s => T.skills[s] >= 10);
    if (d.check === 'gov') ok = G.playerGov;
    if (ok) { G.dreamDone = true; Game.addMoodlet('dream', 'Lifetime dream achieved! 🌟', 40, 24 * 14); UI.dreamDone(d); }
  }
};

// ---- save/load ----
const STORE = (() => { try { const t = '__t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; } catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; } })();
Game.save = function () { try { STORE.setItem(Game.key(), JSON.stringify(G)); } catch (e) { } };
Game.load = function () { try { const s = STORE.getItem(Game.key()); if (!s) return false; G = JSON.parse(s); return true; } catch (e) { return false; } };
Game.wipe = function () { STORE.removeItem(Game.key()); };

// ===== Interactions: home objects, venue activities, social, work, travel =====
'use strict';
const HomeActs = {};
const mk = (o) => Object.assign({ dur: 30 }, o);

HomeActs.list = function (obj) {

      add(TX('orderFood', 'Order food delivery'), '🛵', `${money(Math.round(C.prices.order * fm))} · 40 min`, () => mk({ label: 'Order food', emoji: '🛵', target: obj, dur: 40, cost: Math.round(C.prices.order * fm), onEnd: () => { G.tiny.needs.hunger = clamp(G.tiny.needs.hunger + 65, 0, 100); Game.addMoodlet('order', TX('orderMood', 'Food delivered hot'), 8, 4); Game.flag('eat'); } }));

      break; }
    case 'desk': {
      const np = !Game.hasPower();
      add('Practice coding', '💻', '1 hr · needs power', () => mk({ label: 'Practice coding', emoji: '💻', target: obj, dur: 60, needsPower: true, skill: 'coding', xp: 55, rate: { fun: -4 } }), np);
      add(TX('socialApp', 'Scroll social media'), '📱', '30 min', () => mk({ label: 'Scroll social', emoji: '📱', target: obj, dur: 30, needsPower: true, rate: { fun: 18, social: 14 } }), np);
      const gl = T.skills.coding; const gp = 1500 + 1400 * gl;
      add(`Freelance gig (${money(gp)})`, '🧑‍💻', gl < 2 ? 'Needs Coding 2' : '3 hrs', () => mk({ label: 'Freelance gig', emoji: '🧑‍💻', target: obj, dur: 180, needsPower: true, skill: 'coding', xp: 30, rate: { fun: -6, energy: -3 }, onEnd: () => { Game.pay(gp, true); G.tiny.stats.gigs++; UI.toast(`💸 Client paid ${money(gp)}`, 'good'); } }), np || gl < 2);
      break; }

const VenueActs = {};
VenueActs.make = function (v, act, obj) {
  const T = G.tiny; const C = CT();
  const isFood = act.needs && act.needs.hunger > 0;
  const cost = Math.round((act.cost || 0) * (isFood ? Game.priceMul('food') : 1));
  const reqOk = !act.req || T.skills[act.req[0]] >= act.req[1];
  let info = [];
  if (cost) info.push(money(cost)); info.push(act.min >= 60 ? (act.min / 60) + ' hr' : act.min + ' min');
  let gigPay = 0;
  if (act.gig) { gigPay = act.gig[0] + act.gig[1] * (T.skills[act.skill] || 0); info.unshift('Pays ' + money(gigPay)); }
  const rest = T.gigRest[act.id] && T.gigRest[act.id] > G.t;
  if (rest) info = ['Resting · come back later'];
  if (act.req && !reqOk) info = [`Needs ${SKILL_LABEL[act.req[0]]} ${act.req[1]}`];
  if (act.special === 'pitch' && T.pitchDay === Game.day()) info = ['Once a day'];
  return {
    label: act.label, emoji: act.emoji, info: info.join(' · '), disabled: !reqOk || rest || (act.special === 'pitch' && T.pitchDay === Game.day()),
    make: () => mk({
      label: act.label, emoji: act.emoji, target: obj, dur: act.min, cost, skill: act.skill, xp: act.xp || 45,
      needs: act.needs ? Object.assign({}, act.needs) : null, rate: act.rate,
      onEnd: () => {
        if (act.mood) Game.addMoodlet(act.id, act.mood[0], act.mood[1], act.mood[2] || 4);
        if (isFood) Game.flag('eat');
        if (act.flag) Game.flag(act.flag);
        if (act.needs && act.needs.hygiene >= 50) Game.flag('fresh');
        if (act.gig) { Game.pay(gigPay, true); T.stats.gigs++; T.gigRest[act.id] = G.t + (gigPay >= 25000 ? 45 : 20); UI.toast(`💸 ${act.label}: +${money(gigPay)}`, 'good'); }
        if (act.special === 'cure') { Game.addMoodlet('healthy', 'Feeling healthy', 6, 12); T.moodlets = T.moodlets.filter(m => m.id !== 'sick'); }
        if (act.special === 'pitch') {
          T.pitchDay = Game.day();
          const ok = T.skills.coding >= 5 && T.skills.charisma >= 3 && Math.random() < 0.35 + T.skills.charisma * 0.04;
          if (ok) { const amt = Math.round(rnd(act.prize[0], act.prize[1]) / 10000) * 10000; Game.pay(amt, true); UI.toast(`🚀 Investors loved it! You raised ${money(amt)}!`, 'good', 8000); Game.addMoodlet('funded', 'Got funded! 🚀', 30, 24); }

        }
        if (act.special === 'gamble') { if (Math.random() < 0.4) { const w = (act.cost || 500) * 3; Game.pay(w, true); UI.toast(`⚽ Your bet cut... no wait, it CAME! +${money(w)}`, 'good'); } else UI.toast('⚽ One game cut your ticket 😭', 'bad'); }
      }
    })
  };
};

const Work = { style: 1, active: false };
Work.start = function () {
  const T = G.tiny; const j = T.job; const c = Game.career(j.career); const win = Game.shiftWindow();
  if (!win.canGo) return;
  T.missedChecked = Game.day();
  const fare = Math.round(CT().prices.workFare * Game.priceMul('transport'));
  T.money -= fare; UI.moneyFx(-fare);
  Q.length = 0; UI.renderQueue();
  const h = Game.hm();
  const startAt = Math.max(h, c.start - 0.5);
  G.t = Math.floor(G.t / 1440) * 1440 + Math.round(startAt * 60);
  Work.active = { c, endT: Math.floor(G.t / 1440) * 1440 + Math.round((c.start + c.len) * 60), startT: G.t, late: win.late, tasks: [], won: 0, taskAt: [0.3, 0.65], asked: 0, worked: 0 };
  if (win.late) { j.perf = clamp(j.perf - 8, 0, 100); UI.toast('🏃 You arrived late. Performance -8%', 'bad'); }
  G.loc = 'work'; Scene.loadWork();
};
Work.tick = function () { // per game minute
  const W = Work.active; if (!W) return;
  const j = G.tiny.job; W.worked++;
  const mood = Game.mood();
  const gain = ((mood - 45) / 50 * 2 + [-1.2, 2.2, 4.8][Work.style] + Game.workMod() * 10) / 60;
  j.perf = clamp(j.perf + gain, 0, 100);
  Game.addXp(W.c.skill, 18 / 60);
  const prog = (G.t - W.startT) / (W.endT - W.startT);
  if (W.asked < W.taskAt.length && prog >= W.taskAt[W.asked]) { W.asked++; UI.workTask(W); }
  if (G.t >= W.endT) Work.end(false);
};
Work.end = function (early) {
  const W = Work.active; if (!W) return; const T = G.tiny; const j = T.job;
  const frac = clamp((G.t - W.startT) / (W.endT - W.startT), 0, 1);
  let pay = Game.shiftPay() * frac; let bonus = false;
  if (W.won >= 2 && !early) { pay *= 1.15; bonus = true; }
  pay = Math.round(pay);
  Game.pay(pay, true); T.lastShiftDay = Game.day(); T.missedChecked = Game.day(); T.stats.shifts++;
  let promo = null;
  const c = W.c;
  if (j.perf >= 99.5 && j.level < 5) {
    const need = Game.promoReq(c, j.level + 1);
    if (T.skills[c.skill] >= need) { j.level++; j.perf = 45; promo = c.levels[j.level - 1][0]; Game.addMoodlet('promo', 'Promoted! 🎉', 25, 24); }
    else UI.toast(`📈 ${TX('bossName', 'Oga')} says: get ${SKILL_LABEL[c.skill]} to level ${need} for your promotion.`, 'info', 7000);
  }
  if (early) j.perf = clamp(j.perf - 5, 0, 100);
  Work.active = false; G.loc = 'home';
  UI.backFromWork({ pay, bonus, early, promo, perf: j.perf, title: Game.jobTitle(), place: c.place });
  Game.checkGoals();
  Scene.loadHome();
};

const Travel = {};
Travel.pos = function (loc) {
  const C = CT();
  if (loc === 'home') return C.homes[G.tiny.home].pos;
  const v = C.venues.find(x => x.id === loc); return v ? v.pos : [0, 0];
};
Travel.km = function (a, b) { const p = Travel.pos(a), q = Travel.pos(b); return Math.max(1, Math.round((Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1])) * CT().kmPerTile)); };
Travel.options = function (from, to) {
  const C = CT(); const km = Travel.km(from, to); const fm = Game.priceMul('transport');
  const traffic = G.daily.includes('traffic') ? 1.5 : 1; const TC = 0.45; // game-time compression so trips stay playable
  const rain = G.daily.includes('rain') ? 1.3 : 1;
  const opts = C.transport.map(t => {
    const fare = t.base === 0 && t.perKm === 0 ? 0 : Math.round((t.base + t.perKm * km) * fm);
    const mins = Math.round((t.fixed || 5) + km * t.minPerKm * (t.traffic ? traffic : 1) * rain * TC);
    return Object.assign({}, t, { fare, mins, km });
  });
  if (G.tiny.car) { const car = C.cars.find(c => c.id === G.tiny.car); if (car) opts.push({ id: 'car', name: 'Drive your ' + car.name, emoji: '🚗', fare: Math.round(car.fuel * km * fm), mins: Math.round(4 + km * 2.2 * traffic * rain * TC), km, fun: 4 }); }
  return opts;
};
Travel.go = function (to, opt) {
  const from = G.loc === 'venue' ? G.lastVenue : 'home';
  if (opt.fare && !Game.spend(opt.fare)) return;
  Q.length = 0; UI.renderQueue();
  G.loc = 'travel';
  UI.travelAnim(opt, to, () => {
    G.t += opt.mins;
    if (opt.fun) G.tiny.needs.fun = clamp(G.tiny.needs.fun + opt.fun * opt.mins / 60, 0, 100);
    if (opt.id === 'walk' || opt.id === 'trek') { G.tiny.needs.energy = clamp(G.tiny.needs.energy - opt.mins / 12, 0, 100); G.tiny.needs.hygiene = clamp(G.tiny.needs.hygiene - opt.mins / 15, 0, 100); }
    if (G.daily.includes('traffic') && opt.traffic) Game.addMoodlet('traffic', TX('trafficMood', 'Stuck in traffic 😤'), -8, 3);
    if (to === 'home') { G.loc = 'home'; Scene.loadHome(); }
    else { G.loc = 'venue'; G.lastVenue = to; Scene.loadVenue(to); Game.flag('visit_' + to); const v = CT().venues.find(x => x.id === to); if (v.kind === 'food') Game.flag('buka'); }
    Game.save();
  });
};

  for (let s = 0; s < cols + rows; s++) for (let x = 0; x <= s; x++) {
    const y = s - x; if (x >= cols || y >= rows) continue; const ch = M[y][x];
    let col = pal[ch] || pal['.'];
    if (ch === '~' || ch === 'o') col = ((x * 7 + y * 3) % 5 === 0) ? R.shade(col, 10) : col;
    else col = ((x + y) & 1) ? col : R.shade(col, -6);

  }
  // objects in depth order
  for (let s = 0; s < cols + rows; s++) for (let x = 0; x <= s; x++) {
    const y = s - x; if (x >= cols || y >= rows) continue; const ch = M[y][x]; const vt = venueTiles[x + ',' + y];
    const r = rng();

    if (vt && vt.home) { R.box(ctx, ox, oy, x + 0.15, y + 0.15, 0.7, 0.7, 9, vt.home.mapColor || '#f2e6c9', 8, 4); R.box(ctx, ox, oy, x + 0.1, y + 0.1, 0.8, 0.8, 2, vt.home.roof || '#b5462f', 8, 4, 9); continue; }
    if (vt) {
      const v = vt; if (v.pos[0] !== x || v.pos[1] !== y) continue;
      const outdoor = ['park', 'beach', 'golf', 'nature', 'pyramids', 'nile', 'market', 'bazaar', 'ahwa'].includes(v.kind);
      if (outdoor) {
        R.box(ctx, ox, oy, x + 0.1, y + 0.1, 1.8, 1.8, 1, v.mapColor || (v.kind === 'beach' ? '#f2dfa4' : v.kind === 'market' || v.kind === 'bazaar' ? '#d9a95b' : v.kind === 'pyramids' ? '#e6cf98' : '#5fb85a'), 8, 4);
        if (v.kind === 'pyramids') { const P = (a, b) => { const p = R.iso(a, b, 8, 4); return [ox + p[0], oy + p[1]]; }; const L = P(x + 0.2, y + 1.8), B2 = P(x + 1.8, y + 1.8), Rr = P(x + 1.8, y + 0.2), T = P(x + 1, y + 1); T[1] -= 20; R.poly(ctx, [L, B2, T], '#d9b26f'); R.poly(ctx, [B2, Rr, T], '#b8904f'); }
        else if (v.kind === 'market' || v.kind === 'bazaar') { const cs = ['#d9483b', '#2f7fd1', '#f5c518', '#2fae5b']; for (let i = 0; i < 4; i++) R.box(ctx, ox, oy, x + 0.2 + (i % 2) * 0.8, y + 0.2 + Math.floor(i / 2) * 0.8, 0.6, 0.6, 4, cs[i], 8, 4, 1); }
        else for (let i = 0; i < 3; i++) R.box(ctx, ox, oy, x + 0.3 + (i % 2) * 0.9, y + 0.3 + (i > 1 ? 0.9 : 0), 0.4, 0.4, 7, '#2f8a43', 8, 4, 1);
      } else {
        const h = v.h || 16; const col = v.mapColor || '#e9e2d3';
        R.box(ctx, ox, oy, x + 0.2, y + 0.2, 1.6, 1.6, h, col, 8, 4);
        R.box(ctx, ox, oy, x + 0.2, y + 0.2, 1.6, 1.6, 2, v.roof || R.shade(col, -40), 8, 4, h);
        // windows
        ctx.fillStyle = 'rgba(40,60,90,.35)'; const p = R.iso(x + 1.8, y + 1.8, 8, 4); for (let i = 3; i < h - 2; i += 4) { ctx.fillRect(ox + p[0] + 2, oy + p[1] - i - 1, 2, 1); ctx.fillRect(ox + p[0] + 6, oy + p[1] - i - 3, 2, 1); ctx.fillRect(ox + p[0] - 5, oy + p[1] - i - 1, 2, 1); }
      }
      continue;
    }
    if (ch === '.' && r < 0.62) { const hh = 4 + Math.floor(rng() * 7); const wc = pick2(rng, pal.walls); R.box(ctx, ox, oy, x + 0.2, y + 0.2, 0.6, 0.6, hh, wc, 8, 4); R.box(ctx, ox, oy, x + 0.15, y + 0.15, 0.7, 0.7, 1, pick2(rng, pal.roofs), 8, 4, hh); if (pal.dish && rng() < 0.3) { ctx.fillStyle = '#eee'; const p = R.iso(x + 0.5, y + 0.5, 8, 4); ctx.fillRect(ox + p[0], oy + p[1] - hh - 3, 2, 1); } }
    else if (ch === 'H' && r < 0.75) { const hh = 14 + Math.floor(rng() * 26); const wc = pick2(rng, pal.towers); R.box(ctx, ox, oy, x + 0.15, y + 0.15, 0.7, 0.7, hh, wc, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.25)'; const p = R.iso(x + 0.85, y + 0.85, 8, 4); for (let i = 3; i < hh; i += 3) ctx.fillRect(ox + p[0] + 1, oy + p[1] - i - 1, 3, 1); }
    else if (ch === 'm' && r < 0.85) { const hh = 3 + Math.floor(rng() * 4); R.box(ctx, ox, oy, x + 0.1, y + 0.1, 0.8, 0.8, hh, pick2(rng, ['#d9483b', '#2f7fd1', '#f5c518', '#e67e22', '#9b59b6']), 8, 4); }
    else if (ch === 'g' && r < 0.45) { R.box(ctx, ox, oy, x + 0.35, y + 0.35, 0.3, 0.3, 6, '#2f8a43', 8, 4); }
    else if (ch === 'r' && r < 0.5) { R.box(ctx, ox, oy, x + 0.1, y + 0.1, 0.8, 0.8, 3 + Math.floor(rng() * 6), '#b39a74', 8, 4); }
    else if (ch === 's' && r < 0.06) { R.box(ctx, ox, oy, x + 0.45, y + 0.45, 0.1, 0.1, 8, '#8a6a43', 8, 4); R.box(ctx, ox, oy, x + 0.2, y + 0.2, 0.6, 0.6, 1, '#2f9a4a', 8, 4, 8); }
    else if (ch === 'd' && r < 0.03) { R.box(ctx, ox, oy, x + 0.3, y + 0.3, 0.4, 0.4, 2, '#cdb27a', 8, 4); }
  }

  ctx.font = 'bold 8px Verdana'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'center';
  (C.map.labels || []).forEach(l => { const p = R.iso(l.pos[0], l.pos[1], 8, 4); ctx.fillText(l.text, ox + p[0], oy + p[1]); });
  Scene.mapCanvas = cv;
};
const pick2 = (rng, arr) => arr[Math.floor(rng() * arr.length)];
Scene.initCars = function () {
  const M = CT().map.rows; const roads = [];
  for (let y = 0; y < M.length; y++) for (let x = 0; x < M[0].length; x++) if (M[y][x] === '#' || M[y][x] === '=') roads.push([x, y]);
  Scene.roads = roads; Scene.cars = [];
  const cols = CT().map.carColors;
  for (let i = 0; i < Math.min(40, roads.length / 3); i++) { const r = roads[Math.floor(Math.random() * roads.length)]; Scene.cars.push({ x: r[0], y: r[1], nx: r[0], ny: r[1], t: 1, dx: 0, dy: 0, col: cols[i % cols.length], sp: 0.8 + Math.random() }); }
};
Scene.updateCars = function (dt) {
  const isRoad = (x, y) => { const c = Scene.mapTile(x, y); return c === '#' || c === '='; };
  const jam = G.daily.includes('traffic') ? 0.35 : 1;
  Scene.cars.forEach(c => {
    c.t += dt * c.sp * jam * 1.5;
    if (c.t >= 1) {
      c.x = c.nx; c.y = c.ny; c.t = 0;
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => isRoad(c.x + dx, c.y + dy) && !(dx === -c.dx && dy === -c.dy));
      let ch = opts.find(o => o[0] === c.dx && o[1] === c.dy && Math.random() < 0.75) || opts[Math.floor(Math.random() * opts.length)];
      if (!ch) ch = [-c.dx, -c.dy];
      c.dx = ch[0]; c.dy = ch[1]; c.nx = c.x + c.dx; c.ny = c.y + c.dy;
    }
  });
};
Scene.drawMap = function (ctx, now) {
  ctx.fillStyle = CT().map.palette.o || '#2a6fb0'; ctx.fillRect(0, 0, R.W, R.H);
  ctx.drawImage(Scene.mapCanvas, Scene.cam.x, Scene.cam.y);
  const ox = Scene.cam.x + Scene.mapO[0], oy = Scene.cam.y + Scene.mapO[1];
  Scene.cars.forEach(c => { const gx = c.x + (c.nx - c.x) * c.t + 0.5, gy = c.y + (c.ny - c.y) * c.t + 0.5; const p = R.iso(gx, gy, 8, 4); ctx.fillStyle = c.col; ctx.fillRect(Math.round(ox + p[0] - 1), Math.round(oy + p[1] - 2), 3, 2); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(Math.round(ox + p[0] - 1), Math.round(oy + p[1]), 3, 1); });
  // player marker
  const hp = Travel.pos(G.loc === 'venue' ? G.lastVenue : 'home'); const p = R.iso(hp[0] + 0.5, hp[1] + 0.5, 8, 4);
  R.drawTiny(ctx, ox + p[0], oy + p[1] - 2, G.tiny.look, 'right', 0); R.plumbob(ctx, ox + p[0], oy + p[1] - 22, Game.moodColor(), now);
};
Scene.mapScreen = function (gx, gy) { const p = R.iso(gx, gy, 8, 4); return [(Scene.cam.x + Scene.mapO[0] + p[0]) * R.eff, (Scene.cam.y + Scene.mapO[1] + p[1]) * R.eff]; };

// ===== Sapa City: ad spaces (revenue) =====
// Paid ads come from ads-config.js (window.SAPA_ADS), which the owner edits.
const Ads = {
  defaults: {
    brand: 'Sapa City', currency: '₦',
    contact: { whatsapp: '', email: '' },
    payLinks: { billboard: '', travel: '', venue: '', title: '', tip: '' },
    prices: { billboard: 10000, venue: 15000, travel: 25000, title: 40000 },
    ads: [], goatcounter: '',
  },
  cfg() {
    if (Ads._c) return Ads._c;
    const c = window.SAPA_ADS || {}; const d = Ads.defaults;
    Ads._c = Object.assign({}, d, c, { contact: Object.assign({}, d.contact, c.contact), payLinks: Object.assign({}, d.payLinks, c.payLinks), prices: Object.assign({}, d.prices, c.prices), ads: c.ads || [] });
    return Ads._c;
  },
  today() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); },
  live(spot, slot) {
    const city = CT().id, td = Ads.today();
    return Ads.cfg().ads.filter(a => a.spot === spot && (!a.city || a.city === 'all' || a.city === city) && (!slot || !a.slot || a.slot === slot) && (!a.until || a.until >= td) && (!a.from || a.from <= td));
  },
  rotate(list, offset) { if (!list.length) return null; return list[(Math.floor(Date.now() / 10000) + (offset || 0)) % list.length]; },
  price(spot) { return CT().cur + Number(Ads.cfg().prices[spot] || 0).toLocaleString('en-NG'); },
  advUrl(spot, slot) { return `advertise.html?city=${encodeURIComponent(CT().id)}&spot=${spot}${slot ? '&slot=' + encodeURIComponent(slot) : ''}`; },
  house(spot, slot, offset) {
    // unsold space: alternate "your brand here" with a cross-promo for the other city
    const other = CT().id === 'lagos' ? { text: '🏛️ Play Sapa City: Abuja', link: 'abuja.html', house: true } : { text: '🚌 Play Sapa City: Lagos', link: 'lagos.html', house: true };
    const sell = { text: 'Your brand here', sub: Ads.price(spot) + '/week', link: Ads.advUrl(spot, slot), house: true, sell: true };
    return ((Math.floor(Date.now() / 10000) + (offset || 0)) % 3 === 2) ? other : sell;
  },
  get(spot, slot, offset) { return Ads.rotate(Ads.live(spot, slot), offset) || Ads.house(spot, slot, offset); },
  track(kind, a, spot, slot) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: `ad-${kind}/${spot}/${slot || '-'}/${(a.text || a.image || 'ad').toString().slice(0, 40)}`, title: 'ad ' + kind, event: true }); } catch (e) { } },
  inner(a, cls) {
    const img = a.image ? `<img src="${esc(a.image)}" alt="${esc(a.text || 'Ad')}">` : '';
    return `${img}${a.text && !(a.image && cls === 'bb') ? `<b>${esc(a.text)}</b>` : ''}${a.sub ? `<small>${esc(a.sub)}</small>` : ''}`;
  },
  link(a, spot, slot, cls) {
    const ext = !a.house || a.sell; const href = a.link || Ads.advUrl(spot, slot);
    return `<a class="ad ${cls || ''} ${a.sell ? 'sell' : ''} ${a.house ? 'house' : 'paid'}" href="${esc(href)}" ${ext ? 'target="_blank" rel="noopener sponsored"' : ''} data-spot="${spot}" data-slot="${esc(slot || '')}">${Ads.inner(a, cls)}${a.house ? '' : '<i>Ad</i>'}</a>`;
  },
  bind(root) {
    (root || document).querySelectorAll('a.ad').forEach(el => {
      if (el._b) return; el._b = true;
      el.addEventListener('pointerdown', e => e.stopPropagation());
      el.addEventListener('click', e => { e.stopPropagation(); Ads.track('click', { text: el.textContent }, el.dataset.spot, el.dataset.slot); if (el.getAttribute('href').endsWith('.html') && !el.target) { if (window.Game && G) Game.save(); } });
    });
  },
  // ---- placements ----
  billboardEls() {
    const bbs = (CT().map.billboards || []);
    return bbs.map((b, i) => { const el = document.createElement('div'); el.className = 'bbw'; el.dataset.gx = b.pos[0]; el.dataset.gy = b.pos[1]; el.dataset.slot = b.id; el.dataset.i = i; el.title = b.name; Ads.fillBillboard(el); return el; });
  },
  fillBillboard(el) { const a = Ads.get('billboard', el.dataset.slot, +el.dataset.i); const key = (a.text || '') + (a.image || ''); if (el._k === key) return; el._k = key; el.innerHTML = Ads.link(a, 'billboard', el.dataset.slot, 'bb'); Ads.bind(el); },
  travelHtml() { const a = Ads.get('travel', null, 0); return `<div class="ad-travel"><span>${a.house ? 'Advertise on this screen' : 'Sponsored'}</span>${Ads.link(a, 'travel', '', 'tr')}</div>`; },
  venueHtml(v) { const paid = Ads.rotate(Ads.live('venue', v.id)); if (paid) return `<div class="ad-venue"><span>Sponsored by</span>${Ads.link(paid, 'venue', v.id, 'vn')}</div>`; return `<div class="ad-venue sellv"><a class="ad sell" href="${esc(Ads.advUrl('venue', v.id))}" target="_blank" rel="noopener sponsored" data-spot="venue" data-slot="${esc(v.id)}">Sponsor ${esc(v.short || v.name)} · ${Ads.price('venue')}/week</a></div>`; },
  titleHtml() { const paid = Ads.rotate(Ads.live('title')); if (paid) return `<div class="ad-title"><span>Presented by</span>${Ads.link(paid, 'title', '', 'tt')}</div>`; return `<div class="ad-title"><a class="ad sell" href="${esc(Ads.advUrl('title'))}" target="_blank" rel="noopener sponsored" data-spot="title">📣 Advertise your business in ${esc(CT().short || 'the game')}</a></div>`; },
  init() {
    const gc = Ads.cfg().goatcounter;
    if (gc && !document.getElementById('gcjs')) { const s = document.createElement('script'); s.id = 'gcjs'; s.async = true; s.src = '//gc.zgo.at/count.js'; s.dataset.goatcounter = `https://${gc}.goatcounter.com/count`; document.head.appendChild(s); }

  },

UI.placePins = function () {
  const els = [...document.querySelectorAll('#pins > *')];
  const pts = els.map(el => { const p = Scene.mapScreen(+el.dataset.gx, +el.dataset.gy); return { el, x: Math.round(p[0]), y: Math.round(p[1]), pin: el.classList.contains('pin') || el.classList.contains('locked') }; });
  if (!UI._pinW) UI._pinW = new Map();
  const full = (o) => { if (!UI._pinW.has(o.el)) { o.el.classList.remove('compact'); UI._pinW.set(o.el, [o.el.offsetWidth || 90, o.el.offsetHeight || 28]); } return UI._pinW.get(o.el); };
  const hit = (a, list) => list.some(q => a.x < q.x + q.w + 3 && q.x < a.x + a.w + 3 && a.y < q.y + q.h + 3 && q.y < a.y + a.h + 3);
  const placed = [];
  pts.filter(o => o.pin).sort((a, b) => (b.el.classList.contains('home') - a.el.classList.contains('home')) || (b.y - a.y)).forEach(o => {
    const [fw, fh] = full(o); const locked = o.el.classList.contains('locked');
    let r = { x: o.x - 16, y: o.y - 38, w: fw, h: fh }, compact = false;
    if (!locked && hit(r, placed)) { compact = true; r = { x: o.x - 16, y: o.y - 38, w: 32, h: fh }; }
    let g = 0; while (hit(r, placed) && g++ < 6) r.y -= 14;
    o.el.classList.toggle('compact', compact); o.y = r.y + 38; placed.push(r);
  });
  pts.forEach(o => { o.el.style.transform = `translate(${o.x}px, ${o.y}px)`; });
};

  } else if (app === 'biz') {
