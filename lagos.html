  } else if (app === 'land') {
    body = `<p class="small">Land value grows every Monday. Selling costs 5%. ${esc(C.text.landRiskNote)}</p><div class="list">${C.land.map(l => `<div class="li"><div><b>${esc(l.name)}</b><br><small>+${(l.growth * 100).toFixed(2)}%/week · ${esc(C.text.landRisk)} risk ${Math.round(l.risk * 100)}%</small></div><button class="btn small" data-land="${l.id}" ${T.money >= l.price ? '' : 'disabled'}>Buy ${money(l.price)}</button></div>`).join('')}</div>
    ${G.land.length ? '<h4>Your plots</h4><div class="list">' + G.land.map((l, i) => { const d = C.land.find(x => x.id === l.id); return `<div class="li"><div><b>${esc(d.name)}</b><br><small>Paid ${money(l.paid)} · now ${money(l.value)}</small></div><button class="btn small" data-sell="${i}">Sell ${money(l.value * 0.95)}</button></div>`; }).join('') + '</div>' : ''}`;
  } else if (app === 'shop') {
    body = `<p class="small">New items appear in your home. They follow you when you move.</p><div class="list">${C.shop.map(s => { const own = T.items.includes(s.id); return `<div class="li"><div><b>${s.emoji} ${esc(s.name)}</b><br><small>${esc(s.desc)}</small></div>${own ? '<em>Owned</em>' : `<button class="btn small" data-buy="${s.id}" ${T.money >= s.price ? '' : 'disabled'}>${money(s.price)}</button>`}</div>`; }).join('')}</div>`;
  } else if (app === 'homes') {
    body = `<p class="small">Moving costs 2 weeks' rent upfront. Rent is due every ${DAYS[C.rentDay ?? 5]}.</p><div class="list">${Object.entries(C.homes).filter(([k, v]) => !v.studentOnly || T.home === k).map(([k, v]) => `<div class="li ${T.home === k ? 'mine' : ''}"><div><b>${esc(v.name)}</b><br><small>${esc(v.area)} · ${money(v.rent)}/week · ${v.size[0]}×${v.size[1]} lot</small></div>${T.home === k ? '<em>Home</em>' : `<button class="btn small" data-move="${k}" ${T.money >= v.rent * 2 ? '' : 'disabled'}>Move ${money(v.rent * 2)}</button>`}</div>`).join('')}</div>`;
  } else if (app === 'cars') {
    body = `<p class="small">A car lets you drive anywhere. You pay fuel per km.</p><div class="list">${C.cars.map(c => `<div class="li ${T.car === c.id ? 'mine' : ''}"><div><b>${esc(c.name)}</b><br><small>${money(c.fuel)}/km fuel</small></div>${T.car === c.id ? '<em>Yours</em>' : `<button class="btn small" data-car="${c.id}" ${T.money >= c.price ? '' : 'disabled'}>${money(c.price)}</button>`}</div>`).join('')}</div>`;
  } else if (app === 'vote') {
    const E = G.election; const P = (id) => C.election.policies.find(p => p.id === id);
    body = `<p class="small">${esc(C.election.blurb)} Results Sunday 8 PM.${G.governor ? ` Current: <b>${esc(G.governor)}</b> (${esc(P(G.policy).name)})` : ''}</p><div class="list">${E.cands.filter(c => !c.me).map((c, i) => `<div class="li"><div><b>${esc(c.name)}</b><br><small>Promise: ${esc(P(c.policy).name)}: ${esc(P(c.policy).desc)}</small></div>${E.voted === null ? `<button class="btn small" data-vote="${i}">Vote</button>` : E.voted === i ? '<em>Your vote</em>' : ''}</div>`).join('')}</div>
    ${E.running ? `<p class="ok">You are running on: ${esc(P(E.running).name)}. Charisma and friends bring votes.</p>` : `<h4>Run for ${esc(C.election.title)} (${money(C.election.runCost)})</h4><div class="list">${C.election.policies.map(p => `<div class="li"><div><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small></div><button class="btn small" data-run="${p.id}" ${T.money >= C.election.runCost ? '' : 'disabled'}>Run</button></div>`).join('')}</div><p class="small">Winner gets ${money(C.election.allowance)}/day for a week.</p>`}`;
  } else if (app === 'contacts') {
    const met = Object.entries(G.rel).filter(([n, r]) => r.met);
    body = met.length ? `<div class="list">${met.map(([n, r]) => `<div class="li"><div><b>${esc(n)}</b> <small>${relLabel(r)}</small><br><small>Friendship ${Math.round(r.f)} · Romance ${Math.round(r.r)}</small></div><button class="btn small" data-call="${esc(n)}">📞 Call</button></div>`).join('')}</div>` : '<p class="small">No contacts yet. Meet people at venues on the city map.</p>';
  } else if (app === 'settings') {
    body = `<div class="list"><div class="li"><div><b>Free will</b><br><small>Your character looks after urgent needs when idle at home</small></div><button class="btn small" data-auto>${G.autonomy ? 'On' : 'Off'}</button></div>
    <div class="li"><div><b>Save game</b><br><small>Auto-saves every game hour in this browser</small></div><button class="btn small" data-save>Save now</button></div>
    <div class="li"><div><b>New life</b><br><small>Delete this save and start over</small></div><button class="btn small danger" data-new>Start over</button></div>
    <div class="li"><div><b>Controls</b><br><small>Click objects/people · Space pause · 1/2/3 speed · M map · Esc close</small></div></div></div>`;
  }
  const title = app ? apps.find(a => a[0] === app)[2] : C.phoneName;
  UI.modal(`<div class="phone"><div class="ph-top"><span>${Game.clock()}</span><span>${esc(C.network)} ▂▄▆</span></div><div class="ph-h">${app ? '<button class="back">‹</button>' : ''}<b>${esc(title)}</b><button class="x">×</button></div><div class="ph-body">${body}</div></div>`, 'phonewrap');
  const m = $('#modal');
  m.querySelector('.x').onclick = UI.closeModal; if (m.querySelector('.back')) m.querySelector('.back').onclick = () => UI.phone();
  m.querySelectorAll('.app').forEach(b => b.onclick = () => UI.phone(b.dataset.app));
  const on = (sel, fn) => m.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on('[data-apply]', b => { const c = Game.career(b.dataset.apply); T.job = { career: c.id, level: 1, perf: 50, since: Game.day() + 1 }; UI.toast(`💼 Hired as ${c.levels[0][0]} at ${c.place}! You start tomorrow.`, 'good'); Game.checkGoals(); UI.phone('jobs'); });
  on('[data-quit]', b => { T.job = null; UI.toast('You quit your job.', 'info'); UI.phone('jobs'); });
  on('[data-payrent]', b => { if (Game.spend(T.rentDebt)) { T.rentDebt = 0; UI.phone('bank'); } });
  on('[data-payloan]', b => { const a = T.loan.weekly * T.loan.left; if (Game.spend(a)) { T.loan.left = 0; UI.toast(`🎉 ${T.loan.name} cleared!`, 'good'); UI.phone('bank'); } });
  on('[data-biz]', b => { const d = C.businesses.find(x => x.id === b.dataset.biz); if (Game.spend(d.cost)) { G.biz.push({ id: d.id, day: Game.day() }); UI.toast(`🏪 You now own a ${d.name}!`, 'good'); Game.checkGoals(); UI.phone('biz'); } });
  on('[data-land]', b => { const d = C.land.find(x => x.id === b.dataset.land); if (Game.spend(d.price)) { G.land.push({ id: d.id, value: d.price, paid: d.price }); if (Math.random() < d.risk) { const fee = Math.round(d.price * 0.1); T.money -= fee; UI.moneyFx(-fee); UI.toast(`👀 ${C.text.landRiskEvent} (-${money(fee)})`, 'bad', 8000); } else UI.toast(`🗺️ You bought ${d.name}!`, 'good'); Game.checkGoals(); UI.phone('land'); } });
  on('[data-sell]', b => { const l = G.land.splice(+b.dataset.sell, 1)[0]; Game.pay(Math.round(l.value * 0.95), true); UI.phone('land'); });
  on('[data-buy]', b => { const s = C.shop.find(x => x.id === b.dataset.buy); if (Game.spend(s.price)) { T.items.push(s.id); Game.flag('buy'); UI.toast(`🛋️ ${s.name} delivered home!`, 'good'); if (Scene.mode === 'home') Scene.loadHome(); UI.phone('shop'); } });
  on('[data-move]', b => { const k = b.dataset.move; const v = C.homes[k]; if (Game.spend(v.rent * 2)) { T.home = k; T.rentDebt = 0; UI.toast(`🏘️ Welcome to ${v.name}!`, 'good'); if (G.loc === 'home') Scene.loadHome(); Scene.mapCanvas = null; UI.closeModal(); } });
  on('[data-car]', b => { const c = C.cars.find(x => x.id === b.dataset.car); if (Game.spend(c.price)) { T.car = c.id; Game.flag('buy'); UI.toast(`🚗 Your ${c.name} is parked outside!`, 'good'); UI.phone('cars'); } });
  on('[data-vote]', b => { G.election.voted = +b.dataset.vote; G.election.cands[+b.dataset.vote].votes += 1; UI.toast('🗳️ Vote cast!', 'good'); UI.phone('vote'); });
  on('[data-run]', b => { if (Game.spend(C.election.runCost)) { G.election.running = b.dataset.run; UI.toast(`📣 You are now running for ${C.election.title}!`, 'good'); UI.phone('vote'); } });
  on('[data-call]', b => { const n = b.dataset.call; UI.closeModal(); Game.enqueue(mk({ label: 'Call ' + n, emoji: '📞', dur: 30, rate: { social: 40, fun: 5 }, onEnd: () => { G.rel[n].f = clamp(G.rel[n].f + 3, -100, 100); } })); });
  on('[data-auto]', b => { G.autonomy = !G.autonomy; UI.phone('settings'); });
  on('[data-save]', b => { Game.save(); UI.toast('💾 Saved', 'good'); });
  on('[data-new]', b => { if (confirm('Delete this life and start over?')) { Game.wipe(); location.reload(); } });
};

// ---------- creator ----------
UI.title = function () {
  const C = CT(); const has = !!STORE.getItem(Game.key());
  const ov = $('#overlay'); ov.classList.remove('hidden'); ov.className = 'titlescreen';
  ov.innerHTML = `<div class="title-card panel"><div class="stripe tall"></div><div class="tc-in"><div class="tc-logo">${C.logoEmoji}</div><h1>${esc(C.brand || C.name)}</h1>${C.short ? `<div class="tc-city">${esc(C.short)}</div>` : ''}<p class="tag">${esc(C.tagline)}</p><canvas id="titleTinies" width="120" height="30"></canvas><div class="row col">${has ? '<button class="btn primary big" id="cont">Continue your life</button>' : ''}<button class="btn ${has ? '' : 'primary'} big" id="newl">Start a new life</button></div><p class="small">${esc(C.blurb)}</p>${Ads.titleHtml()}<div class="slogan">“${esc(pick(C.text.slogans))}”</div></div></div>`; Ads.bind(ov);
  const c = $('#titleTinies'); const x = c.getContext('2d'); C.npcs.slice(0, 9).forEach((n, i) => R.drawTiny(x, 8 + i * 13, 26, n.look, i % 2 ? 'left' : 'right', 0));
  if (has) $('#cont').onclick = () => { Game.load(); UI.startGame(); };
  $('#newl').onclick = () => UI.creator();
};
UI.creator = function () {
  const C = CT(); const ov = $('#overlay');
  const st = { name: pick(C.text.names), look: Object.assign({}, C.npcs[0].look, { skin: C.look.skins[2], hair: 'afro', hairColor: '#1b1410', shirt: C.look.shirts[0], pants: C.look.pants[0] }), traits: [], dream: C.dreams[0].id };
  const render = () => {
    ov.innerHTML = `<div class="creator panel"><div class="stripe"></div><div class="cr-in"><h2>Create your character</h2>
    <div class="cr-grid"><div class="cr-prev"><canvas id="crPrev" width="20" height="24"></canvas><input id="crName" maxlength="16" value="${esc(st.name)}" aria-label="Name"><button class="btn small" id="crRand">🎲 Random look</button></div>
    <div class="cr-opts">
      <label>Skin</label><div class="sw">${C.look.skins.map(c => `<button class="swc ${st.look.skin === c ? 'on' : ''}" data-k="skin" data-v="${c}" style="background:${c}"></button>`).join('')}</div>
      <label>Hair</label><div class="sw">${C.look.hairs.map(c => `<button class="swt ${st.look.hair === c ? 'on' : ''}" data-k="hair" data-v="${c}">${c}</button>`).join('')}</div>
      <label>Hair colour</label><div class="sw">${C.look.hairColors.map(c => `<button class="swc ${st.look.hairColor === c ? 'on' : ''}" data-k="hairColor" data-v="${c}" style="background:${c}"></button>`).join('')}</div>
      <label>Top</label><div class="sw">${C.look.shirts.map(c => `<button class="swc ${st.look.shirt === c ? 'on' : ''}" data-k="shirt" data-v="${c}" style="background:${c}"></button>`).join('')}</div>
      <label>Bottoms</label><div class="sw">${C.look.pants.map(c => `<button class="swc ${st.look.pants === c ? 'on' : ''}" data-k="pants" data-v="${c}" style="background:${c}"></button>`).join('')}</div>
    </div></div>
    <label>Pick 2 traits</label><div class="traits">${C.traits.map(t => `<button class="trait ${st.traits.includes(t.id) ? 'on' : ''}" data-t="${t.id}"><b>${t.emoji} ${esc(t.name)}</b><small>${esc(t.desc)}</small></button>`).join('')}</div>
    <label>Lifetime dream</label><div class="traits">${C.dreams.map(d => `<button class="trait ${st.dream === d.id ? 'on' : ''}" data-d="${d.id}"><b>${d.emoji} ${esc(d.name)}</b><small>${esc(d.desc)}</small></button>`).join('')}</div>
    <div class="row"><button class="btn" id="crBack">Back</button><button class="btn primary big" id="crGo" ${st.traits.length === 2 ? '' : 'disabled'}>${st.traits.length === 2 ? 'Next: ' + esc(C.lottery.title) : 'Pick 2 traits'}</button></div></div></div>`;
    const pc = $('#crPrev').getContext('2d'); pc.clearRect(0, 0, 20, 24); R.drawTiny(pc, 10, 22, st.look, 'right', 0);
    ov.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { st.look[b.dataset.k] = b.dataset.v; render(); });
    ov.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const id = b.dataset.t; if (st.traits.includes(id)) st.traits = st.traits.filter(x => x !== id); else if (st.traits.length < 2) st.traits.push(id); else { st.traits.shift(); st.traits.push(id); } render(); });
    ov.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { st.dream = b.dataset.d; render(); });
    $('#crName').oninput = (e) => st.name = e.target.value || 'Tiny';
    $('#crRand').onclick = () => { st.look.skin = pick(C.look.skins); st.look.hair = pick(C.look.hairs); st.look.hairColor = pick(C.look.hairColors); st.look.shirt = pick(C.look.shirts); st.look.pants = pick(C.look.pants); render(); };
    $('#crBack').onclick = () => UI.title();
    $('#crGo').onclick = () => { if (st.traits.length === 2) UI.lottery(st); };
  };
  render();
};
UI.lottery = function (st) {
  const C = CT(); const L = C.lottery; const ov = $('#overlay');
  const rich = Math.random() < L.rich.chance;
  ov.innerHTML = `<div class="creator panel lot"><div class="stripe"></div><div class="cr-in center"><h2>${esc(L.title)}</h2><p>${esc(L.intro)}</p><div class="spinner" id="spin"><div class="card-a">${L.rich.emoji}<b>${esc(L.rich.name)}</b></div><div class="card-b">${L.poor.emoji}<b>${esc(L.poor.name)}</b></div></div><p class="small" id="spinTxt">Rolling the dice of life...</p></div></div>`;
  const sp = $('#spin'); let i = 0; const iv = setInterval(() => { sp.classList.toggle('flip', i++ % 2 === 0); }, 140);
  setTimeout(() => {
    clearInterval(iv); sp.classList.toggle('flip', !rich); sp.classList.add('done');
    const R2 = rich ? L.rich : L.poor;
    setTimeout(() => {
      ov.innerHTML = `<div class="creator panel lot"><div class="stripe"></div><div class="cr-in center"><div class="big-e huge">${R2.emoji}</div><h2>You are a ${esc(R2.name)}!</h2><p class="tag">“${esc(R2.tag)}”</p><ul class="perks">${R2.perks.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      ${rich ? '<div class="row"><button class="btn primary big" id="lgo">Start life</button></div>' : `<label>Where will you live?</label><div class="traits">${L.poor.homes.map(k => { const hm = C.homes[k]; return `<button class="trait" data-h="${k}"><b>${esc(hm.name)}</b><small>${esc(hm.area)} · ${money(hm.rent)}/week · start with ${money(L.poor.cash[k])}${hm.note ? ' · ' + esc(hm.note) : ''}</small></button>`; }).join('')}</div>`}</div></div>`;
      const go = (home) => { Game.newState(st); Game.applyLottery(rich ? 'rich' : 'poor', home); Game.save(); UI.startGame(true); };
      if (rich) $('#lgo').onclick = () => go(); else ov.querySelectorAll('[data-h]').forEach(b => b.onclick = () => go(b.dataset.h));
    }, 900);
  }, 2600);
};
UI.startGame = function (fresh) {
  const ov = $('#overlay'); ov.classList.add('hidden'); ov.className = 'hidden'; ov.innerHTML = '';
  $('#hud').classList.remove('hidden');
  if (!G.election) Game.rollWeek(true);
  UI.updateSpeed(); UI.renderTab(); UI.renderQueue();
  if (G.loc === 'venue' && G.lastVenue) Scene.loadVenue(G.lastVenue); else { G.loc = 'home'; Scene.loadHome(); }
  const C = CT();
  $('#sticker').textContent = pick(C.text.slogans);
  if (fresh) setTimeout(() => { UI.pausedByModal = true; UI.modal(`<div class="vi-h stripe"></div><div class="vi"><h2>${esc(C.text.welcome)}</h2><ul class="perks">${C.text.howto.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="row"><button class="btn primary" id="wl">Let's go</button></div></div>`); $('#wl').onclick = UI.closeModal; }, 300);
  UI.started = true;
};

// ---------- main loop ----------
const Main = { last: 0, acc: 0 };
Main.loop = function (now) {
  requestAnimationFrame(Main.loop);
  const dt = Math.min(0.1, (now - Main.last) / 1000 || 0); Main.last = now;
  if (!G || !UI.started) { if (R.ctx) { R.ctx.fillStyle = CT().theme.void; R.ctx.fillRect(0, 0, R.W, R.H); } return; }
  const blocking = UI.pausedByModal || !$('#overlay').classList.contains('hidden') || !$('#modal').classList.contains('hidden');
  if (!blocking) {
    let rate = SPEEDS[G.speed];
    if (G.speed > 0) { if (Scene.mode === 'work') rate = 45; else if (Scene.ff) rate = 50; }
    Main.acc += dt * rate; let n = 0;
    while (Main.acc >= 1 && n < 90) { Main.acc -= 1; n++; Game.tickMinute(); if (Scene.mode === 'work') Work.tick(); }
    if (Main.acc > 5) Main.acc = 0;
    if (G.speed > 0 && Scene.mode !== 'map') Scene.update(dt);
    if (Scene.mode === 'map') Scene.update(dt);
    { const ab = Math.floor(G.t / 15); if (Main._auto !== ab) { Main._auto = ab; Game.autonomy(); } }
  }
  Scene.draw(now);
  if ((Main._ui = (Main._ui || 0) + dt) > 0.12) { Main._ui = 0; UI.refresh(); }
};
Main.start = function () {
  R.init($('#game'));
  UI.build(); Ads.init();
  // input
  const cv = $('#game'); let down = null;
  cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, cx: Scene.cam.x, cy: Scene.cam.y, moved: false }; });
  window.addEventListener('pointermove', (e) => {
    if (down && Scene.mode === 'map') { const dx = (e.clientX - down.x) / R.eff, dy = (e.clientY - down.y) / R.eff; if (Math.abs(dx) + Math.abs(dy) > 3) down.moved = true; Scene.cam.x = Math.round(down.cx + dx); Scene.cam.y = Math.round(down.cy + dy); Scene.clampCam(); }
    else if (Scene.mode !== 'map' && G && Scene.objs.length) { const r = cv.getBoundingClientRect(); Scene.hover = Scene.hitTest((e.clientX - r.left) / R.eff, (e.clientY - r.top) / R.eff); cv.style.cursor = Scene.hover && (Scene.hover.obj || Scene.hover.npc || Scene.hover.self) ? 'pointer' : 'default'; }
  });
  window.addEventListener('pointerup', (e) => {
    if (!down) return; const d = down; down = null;
    if (e.target !== cv) return;
    if (Scene.mode === 'map') { if (!d.moved) UI.closeMenu(); return; }
    if (Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) < 8) { const r = cv.getBoundingClientRect(); Scene.click((e.clientX - r.left) / R.eff, (e.clientY - r.top) / R.eff, e.clientX, e.clientY); }
  });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#menu') && e.target !== cv) UI.closeMenu(); });
  requestAnimationFrame(Main.loop);
  UI.title();
};
window.addEventListener('load', Main.start);

</script>
